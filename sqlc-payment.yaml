version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/payment/platform/database/migrations"
    queries: "internal/payment/platform/database/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/payment/platform/database/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
