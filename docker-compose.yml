services:
  ecommerce-postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: afraniocaires
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce_postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afraniocaires -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - payment_postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ecommerce-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APPLICATION_PORT: "3000"
      APPLICATION_ENVIRONMENT: development
      POSTGRESQL_DATA_SOURCE: host=ecommerce-postgresql port=5432 user=afraniocaires password=postgres dbname=ecommerce sslmode=disable
      JSON_WEB_TOKEN_SECRET: ${JSON_WEB_TOKEN_SECRET:-replace-this-local-secret}
      JSON_WEB_TOKEN_ISSUER: ecommerce
      JSON_WEB_TOKEN_LIFETIME: 15m
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_COMMAND_EXCHANGE: ecommerce.commands
      RABBITMQ_EVENT_EXCHANGE: ecommerce.events
      RABBITMQ_PAYMENT_QUEUE: payment.requests
      RABBITMQ_RESULT_QUEUE: ecommerce.payment-results
      OUTBOX_INTERVAL: 250ms
      OUTBOX_BATCH_SIZE: "20"
      MESSAGE_RETRY_LIMIT: "5"
      SHUTDOWN_TIMEOUT: 5s
    ports:
      - "3000:3000"
    depends_on:
      ecommerce-postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    environment:
      PAYMENT_APPLICATION_PORT: "3001"
      PAYMENT_POSTGRESQL_DATA_SOURCE: host=payment-postgresql port=5432 user=payment password=postgres dbname=payments sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_COMMAND_EXCHANGE: ecommerce.commands
      RABBITMQ_EVENT_EXCHANGE: ecommerce.events
      RABBITMQ_PAYMENT_QUEUE: payment.requests
      RABBITMQ_RESULT_QUEUE: ecommerce.payment-results
      OUTBOX_INTERVAL: 250ms
      OUTBOX_BATCH_SIZE: "20"
      MESSAGE_RETRY_LIMIT: "5"
      SHUTDOWN_TIMEOUT: 5s
    ports:
      - "3001:3001"
    depends_on:
      payment-postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ecommerce_postgresql_data:
  payment_postgresql_data:
  rabbitmq_data:
